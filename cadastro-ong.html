<!DOCTYPE html>
<html lang="pt-br">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>AuDoção - Cadastro de ONG</title>
     <link rel="stylesheet" href="style.css">
     <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
     <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body class="auth-page">

     <main class="auth-container auth-container--wide">
          <section class="auth-card auth-card--wide">
               <div class="auth-header">
                    <div class="auth-header--brand">
                         <img src="src/logo-audocao.png" alt="Logo AuDoção" class="paw brand-logo-full">
                    </div>
                    <span class="brand-name">AuDoção</span>
                    <p>Cadastre sua ONG e comece a divulgar pets para adoção.</p>
               </div>

               <form class="auth-form auth-form--grid" id="form-cadastro-ong">
                    <div class="input-group">
                         <label for="nome-ong">Nome da ONG</label>
                         <input type="text" id="nome-ong" placeholder="Ex: Amigos das Patas" required>
                    </div>

                    <div class="field-row">
                         <div class="input-group">
                              <label for="cnpj">CNPJ</label>
                              <input type="text" id="cnpj" placeholder="00.000.000/0000-00" required>
                         </div>

                         <div class="input-group">
                              <label for="responsavel">Responsável</label>
                              <input type="text" id="responsavel" placeholder="Nome do responsável" required>
                         </div>
                    </div>

                    <div class="input-group">
                         <label for="email">E-mail</label>
                         <input type="email" id="email" placeholder="ong@email.com" required>
                    </div>

                    <div class="field-row">

                         <div class="input-group">

                              <label for="password">Senha</label>

                              <div class="password-field">

                                   <input type="password" id="password" placeholder="Mínimo 8 caracteres" minlength="8"
                                        required>

                                   <button type="button" class="toggle-password" data-target="password"
                                        aria-label="Mostrar senha" aria-pressed="false">
                                        <i class="fa-jelly fa-regular fa-eye-slash" aria-hidden="true"></i>
                                   </button>

                              </div>

                         </div>

                         <div class="input-group">

                              <label for="confirm-password">Confirmar Senha</label>

                              <div class="password-field">

                                   <input type="password" id="confirm-password" placeholder="Repita sua senha"
                                        minlength="8" required>

                                   <button type="button" class="toggle-password" data-target="confirm-password"
                                        aria-label="Mostrar confirmação de senha" aria-pressed="false">
                                        <i class="fa-jelly fa-regular fa-eye-slash" aria-hidden="true"></i>
                                   </button>

                              </div>

                         </div>

                    </div>

                    <p class="form-error" id="form-error"></p>

                    <button type="submit" class="btn btn-primary" onclick="window.location.href='login.html'">Cadastrar
                         ONG</button>
               </form>

               <div class="auth-footer">
                    <p>Já tem uma conta de ONG? <a href="login.html">Faça login</a></p>
               </div>
          </section>
     </main>

     <script>
          const togglePasswordButtons = document.querySelectorAll(".toggle-password");

          togglePasswordButtons.forEach((button) => {
               button.addEventListener("click", () => {
                    const targetId = button.dataset.target;
                    const input = document.getElementById(targetId);
                    const icon = button.querySelector("i");

                    const passwordIsHidden = input.type === "password";

                    input.type = passwordIsHidden ? "text" : "password";

                    icon.classList.toggle("fa-eye", passwordIsHidden);
                    icon.classList.toggle("fa-eye-slash", !passwordIsHidden);

                    button.setAttribute(
                         "aria-pressed",
                         String(passwordIsHidden)
                    );

                    button.setAttribute(
                         "aria-label",
                         passwordIsHidden
                              ? "Ocultar senha"
                              : "Mostrar senha"
                    );
               });
          });

          const form = document.getElementById("form-cadastro-ong");
          const errorEl = document.getElementById("form-error");

          form.addEventListener("submit", (event) => {
               event.preventDefault();
               errorEl.textContent = "";

               const senha = document.getElementById("password").value;
               const confirmarSenha =
                    document.getElementById("confirm-password").value;

               if (senha !== confirmarSenha) {
                    errorEl.textContent =
                         "As senhas não coincidem. Tente novamente.";
                    return;
               }

               window.location.href = "dashboard.html";
          });
     </script>

</body>

</html>
