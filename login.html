<!DOCTYPE html>
<html lang="pt-br">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>AuDoção - Entrar</title>
     <link rel="stylesheet" href="style.css">
     <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
     <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body class="auth-page">

     <main class="auth-container">
          <section class="auth-card">
               <div class="auth-header">
                    <div class="auth-header--brand">
                         <img
                              src="src/logo-audocao.png"
                              alt="Logo AuDoção"
                              class="paw brand-logo-full"
                         >
                    </div>

                    <span class="brand-name">AuDoção</span>

                    <p>Bem-vindo de volta! Entre para continuar.</p>

               </div>

               <form class="auth-form">

                    <div class="input-group">

                         <label for="email">E-mail</label>

                         <input
                              type="email"
                              id="email"
                              placeholder="seu@email.com"
                              required
                         >

                    </div>

                    <div class="input-group">

                         <div class="label-wrapper">

                              <label for="password">Senha</label>

                              <a href="recuperar-senha.html" class="forgot-password">
                                   Esqueceu a senha?
                              </a>

                         </div>

                         <div class="password-field">

                              <input
                                   type="password"
                                   id="password"
                                   placeholder="••••••••"
                                   required
                              >

                              <button
                                   type="button"
                                   class="toggle-password"
                                   aria-label="Mostrar senha"
                                   aria-pressed="false"
                              >
                                   <i
                                        class="fa-jelly fa-regular fa-eye-slash"
                                        aria-hidden="true"
                                   ></i>
                              </button>

                         </div>

                    </div>

                    <button
                         type="submit"
                         class="btn btn-primary"
                         onclick="window.location.href='dashboard.html'"
                    >
                         Entrar
                    </button>

               </form>

               <div class="auth-footer">

                    <p>
                         Não possui conta?
                         <a href="cadastro-ong.html">Cadastre-se</a>
                    </p>

               </div>

          </section>

     </main>

     <script>
          const passwordInput = document.querySelector("#password");
          const togglePasswordButton = document.querySelector(".toggle-password");
          const passwordIcon = togglePasswordButton.querySelector("i");

          togglePasswordButton.addEventListener("click", function () {
               const passwordIsHidden = passwordInput.type === "password";

               if (passwordIsHidden) {
                    passwordInput.type = "text";

                    passwordIcon.classList.remove("fa-eye-slash");
                    passwordIcon.classList.add("fa-eye");

                    togglePasswordButton.setAttribute(
                         "aria-label",
                         "Ocultar senha"
                    );

                    togglePasswordButton.setAttribute(
                         "aria-pressed",
                         "true"
                    );
               } else {
                    passwordInput.type = "password";

                    passwordIcon.classList.remove("fa-eye");
                    passwordIcon.classList.add("fa-eye-slash");

                    togglePasswordButton.setAttribute(
                         "aria-label",
                         "Mostrar senha"
                    );

                    togglePasswordButton.setAttribute(
                         "aria-pressed",
                         "false"
                    );
               }
          });
     </script>

</body>

</html>
